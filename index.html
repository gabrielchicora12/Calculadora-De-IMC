<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <!-- Link do Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
</head>
<body class="container">

    <h1>Calculadora de IMC</h1>

    <form class="form m-2">
        <label class="form-label">Peso (Kg)</label> 
        <input class="form-control" type="number" step="0.1" id="v1"/>
        
        <label class="form-label">Altura (m)</label> 
        <input class="form-control" type="number" step="0.01" id="v2"/>
        
        <a href="#" class="btn btn-primary m-2" onclick="executar()">Executar</a>
    </form>

    <script>
        // Funções de cálculo e classificação do IMC
        const imc = (peso, altura) => peso / (altura * altura);

        const situacao = (valor_imc) => {
            if (valor_imc < 18.5)
                return "Abaixo do peso";
            else if (valor_imc < 25)
                return "Peso ideal (parabéns)";
            else if (valor_imc < 30)
                return "Levemente acima do peso";
            else if (valor_imc < 35)
                return "Obesidade de grau I";
            else if (valor_imc < 40)
                return "Obesidade de grau II (severa)";
            else
                return "Obesidade de grau III (mórbida)";
        }

        // Função acionada ao clicar em Executar
        const executar = () => {
            const peso = parseFloat(document.getElementById("v1").value);
            const altura = parseFloat(document.getElementById("v2").value);

            if (isNaN(peso) || isNaN(altura) || altura <= 0) {
                alert("Por favor, preencha os campos corretamente.");
                return;
            }

            const v_imc = imc(peso, altura);
            const v_sit = situacao(v_imc);

            alert(`IMC: ${v_imc.toFixed(2)} :: Situação: ${v_sit}`);
        }
    </script>

</body>
</html>
